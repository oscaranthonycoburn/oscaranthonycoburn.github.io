# Pages CMS (https://pagescms.org) — form-based editors for the News board and the Videos (TV) list.
# Sign in at https://app.pagescms.org with GitHub; only people with write access to
# this repo (members of the oscaranthonycoburn org) can open it and post.
media:
  - name: news
    label: News images
    input: assets/news
    output: /assets/news
  - name: videos
    label: Video files
    input: assets/videos
    output: /assets/videos
    categories: [video]
    rename: safe

content:
  - name: news
    label: News board
    type: file
    path: content/news.json
    format: json
    fields:
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: category
            label: Category
            type: select
            required: true
            options:
              values: [Releases, Shows, Videos, Announcements, Behind the Scenes]
          - name: date
            label: Date & time posted
            type: date
            options:
              time: true
            description: Leave this as now for new posts. A new post sets off the breaking-news sirens for 30 seconds after it goes live.
          - name: body
            label: Text
            type: text
            description: Leave a blank line between paragraphs.
          - name: image
            label: Image (optional)
            type: image
            options:
              media: news
          - name: link
            label: Link (optional)
            type: string
            description: A full web address, e.g. a ticket page or a new video.
          - name: linkLabel
            label: Link button text
            type: string
            description: e.g. "Get tickets" or "Watch now". Defaults to "Read more".
          - name: pinned
            label: Pin to the top
            type: boolean
          - name: hideAfter
            label: Hide after (optional)
            type: string
            description: Type a date like 2026-12-31 and the post disappears on its own after that day. Leave EMPTY to keep it up until you delete it.

  - name: videos
    label: Videos (TV)
    type: file
    path: content/videos.json
    format: json
    fields:
      - name: videos
        label: Videos
        type: object
        list: true
        description: These are the titles on the TV menu in the Videos tab, top to bottom. Drag to reorder.
        fields:
          - name: title
            label: Title
            type: string
            required: true
            description: Shown on the TV menu. About 20 characters fits on one line; longer titles get cut off with "…".
          - name: video
            label: YouTube link
            type: string
            description: Paste the video's YouTube link, e.g. https://youtu.be/abc123 or https://www.youtube.com/watch?v=abc123 (Shorts links work too). Use this OR a video file below.
          - name: file
            label: …or a video file
            type: file
            options:
              media: videos
              categories: [video]
            description: Upload an MP4 instead of a YouTube link (no YouTube buttons ever show). Keep it small, under 25 MB (720p is plenty on the TV). If both are filled in, the file is used.
          - name: zoom
            label: Zoom (optional)
            type: number
            description: Leave EMPTY for normal videos. Only for videos with black bars built in (like square album-art videos), 1.44 zooms in until the picture fills the TV.
